[project]
name = "bookwyrm"
version = "0.8.0"
description = "Social reading and reviewing, decentralized with ActivityPub"
requires-python = ">=3.10"
dependencies = [
    "aiohttp==3.12.14",
    "bleach==6.1.0",
    "boto3~=1.34",
    "bw-file-resubmit==0.6.0rc2",
    "celery==5.3.6",
    "colorthief==0.2.1",
    "Django==5.2.3",
    "django-celery-beat==2.8.1",
    "django-compressor==4.4",
    "django-csp==3.8",
    "django-imagekit==5.0.0",
    "django-model-utils==4.4.0",
    "django-oauth-toolkit==2.3.0",
    "django-pgtrigger==4.11.0",
    "django-sass-processor==1.4.1",
    "django-storages[azure]~=1.14",
    "environs==11.0.0",
    "flower==2.0.1",
    "gunicorn>=23.0.0,<24.0.0",
    "packaging>=21.3",
    "hiredis==2.3.2",
    "libsass==0.23.0",
    "Markdown==3.6",
    "opentelemetry-api==1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.24.0",
    "opentelemetry-instrumentation-celery==0.45b0",
    "opentelemetry-instrumentation-django==0.45b0",
    "opentelemetry-instrumentation-psycopg==0.45b0",
    "opentelemetry-sdk==1.24.0",
    "Pillow>=11.3.0,<12.0.0",
    "psycopg[binary]==3.2.9",
    "pycryptodome==3.20.0",
    "pyotp==2.9.0",
    "python-dateutil==2.9.0.post0",
    "qrcode==7.4.2",
    "redis==5.0.3",
    "requests>=2.32.0,<3",
    "responses==0.25.0",
    "s3-tar==0.1.13",
    "sqlparse==0.5.1",
    "ua-parser[regex]==1.0.1",
]

[dependency-groups]
dev = ["black>=22,<23"]

[tool.hatch.build.targets.sdist]
include = [
    "bookwyrm",
    "celerywyrm",
]

[tool.hatch.build.targets.wheel]
include = [
    "bookwyrm",
    "celerywyrm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
required-version = "22"

